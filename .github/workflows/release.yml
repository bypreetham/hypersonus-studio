name: Build Multiplatform Desktop Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: HypersonusStudio-Windows.exe
            build_cmd: flet build windows
          - os: macos-latest
            artifact_name: HypersonusStudio-macOS.dmg
            build_cmd: flet build macos
          - os: ubuntu-latest
            artifact_name: HypersonusStudio-Linux
            build_cmd: flet build linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2 libasound2-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet[all]

      - name: Run DSP Unit Tests
        run: |
          pytest tests/test_dsp.py -v

      - name: Build Standalone Executable
        run: ${{ matrix.build_cmd }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
